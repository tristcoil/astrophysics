  <g id="text_15">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans', sans-serif; fill: #898781" transform="translate(7.2 333.40242)">Tokovinin, Thomas, Sterzik &amp; Udry (2006, A&amp;A 450, 681): 165 solar-type spectroscopic binaries searched for tertiaries. Our</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans', sans-serif; fill: #898781" transform="translate(14.667773 342.404471)">counts from their Table 5; their maximum-likelihood correction for undetected companions raises the fractions (violet).</text>
